version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: serviceflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=serviceflow
    volumes:
      - serviceflow_mongo_data:/data/db
    networks:
      - serviceflow-network

  # Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: serviceflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/serviceflow
      - JWT_SECRET=serviceflow_docker_production_secret_key_99
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - serviceflow-network

  # Frontend Web Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: serviceflow-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - serviceflow-network

volumes:
  serviceflow_mongo_data:
    driver: local

networks:
  serviceflow-network:
    driver: bridge
